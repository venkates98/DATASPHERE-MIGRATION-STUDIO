<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <title th:text="${pageTitle != null ? pageTitle + ' · ' + appName : appName}">DataSphere Migration Studio</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
    <link rel="stylesheet" th:href="@{/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <th:block layout:fragment="styles"></th:block>
</head>
<body class="ds-app">
<a class="ds-skip-link" href="#main-content">Skip to main content</a>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<div class="ds-sidebar-backdrop" data-ds-sidebar-close></div>

<div class="ds-main">
    <header th:replace="~{fragments/navbar :: navbar}"></header>

    <main id="main-content" class="ds-content" tabindex="-1">
        <div th:replace="~{fragments/page-header :: page-header}"></div>
        <div layout:fragment="content">Page content</div>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>
</div>

<div th:replace="~{fragments/modals :: confirm-modal}"></div>
<div th:replace="~{fragments/notifications :: notifications}"></div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
<th:block layout:fragment="scripts"></th:block>
</body>
</html>
