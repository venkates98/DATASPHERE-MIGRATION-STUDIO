<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="navbar" class="ds-navbar">
    <button type="button" class="ds-icon-btn" id="ds-sidebar-toggle" aria-controls="ds-sidebar"
            aria-expanded="true" aria-label="Toggle sidebar">
        <i class="bi bi-list" aria-hidden="true"></i>
    </button>

    <div class="ds-navbar-tagline d-none d-md-block">Connect. Map. Validate. Migrate.</div>

    <div class="ds-navbar-right">
        <span class="ds-chip ds-chip-info d-none d-sm-inline-flex" tabindex="0" data-bs-toggle="tooltip"
              data-bs-placement="bottom"
              title="Projects and mappings are saved on the server (without passwords). Database passwords are held in memory only, so enter them again after the application restarts.">
            <i class="bi bi-shield-lock" aria-hidden="true"></i> Passwords in memory only
        </span>

        <div class="dropdown" th:if="${currentUser != null}">
            <button class="ds-user-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false"
                    aria-label="User menu">
                <span class="ds-avatar" aria-hidden="true" th:text="${currentUser.initials}">VK</span>
                <span class="ds-user-name d-none d-sm-inline" th:text="${currentUser.displayName}">User</span>
                <i class="bi bi-chevron-down small" aria-hidden="true"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end ds-user-menu">
                <li class="px-3 py-2">
                    <div class="fw-semibold" th:text="${currentUser.displayName}">User</div>
                    <div class="small text-muted">Signed in as <span th:text="${currentUser.username}">user</span></div>
                </li>
                <li><hr class="dropdown-divider"></li>
                <li><a class="dropdown-item" th:href="@{/settings}"><i class="bi bi-gear me-2" aria-hidden="true"></i>Settings</a></li>
                <li><a class="dropdown-item" th:href="@{/help}"><i class="bi bi-question-circle me-2" aria-hidden="true"></i>Help</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/logout}" method="post"
                          data-ds-confirm="You will be signed out of DataSphere Migration Studio."
                          data-ds-confirm-title="Sign out?" data-ds-confirm-label="Sign out" data-ds-confirm-style="primary">
                        <button type="submit" class="dropdown-item"><i class="bi bi-box-arrow-left me-2" aria-hidden="true"></i>Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</header>
</body>
</html>
