<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Reusable confirmation dialog. Driven by data-ds-confirm* attributes on forms/buttons (see app.js). -->
<div th:fragment="confirm-modal" class="modal fade" id="ds-confirm-modal" tabindex="-1"
     aria-labelledby="ds-confirm-title" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content ds-modal">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="ds-confirm-title">Please confirm</h2>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="ds-confirm-body">Are you sure?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="ds-confirm-ok">Confirm</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
