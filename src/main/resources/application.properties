# ---------------------------------------------------------------------------
# DataSphere Migration Studio - base configuration
# Profiles: 'dev' (local development only) and 'prod' (HTTPS deployment).
# No profile is active by default; the app refuses to start until an administrator is configured.
# ---------------------------------------------------------------------------

spring.application.name=datasphere-migration-studio
# Startup banner is src/main/resources/banner.txt
spring.main.banner-mode=console

# Optional local .env file (never committed). Format: KEY=value, one per line.
spring.config.import=optional:file:./.env[.properties]

spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML
spring.web.resources.cache.cachecontrol.max-age=1h
spring.mvc.throw-exception-if-no-handler-found=true

# ---- Server / session ----
server.port=${DATASPHERE_PORT:8080}
server.shutdown=graceful
server.servlet.session.timeout=${DATASPHERE_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.name=DSMSESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set DATASPHERE_COOKIE_SECURE=true whenever the app is served over HTTPS (the prod profile forces it).
server.servlet.session.cookie.secure=${DATASPHERE_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie
server.forward-headers-strategy=none

# Never expose internals in error responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# ---- Application settings ----
datasphere.version=@project.version@

# The initial administrator is NEVER defined in source control.
# Supply a BCrypt hash via environment variables (see .env.example) or use the 'dev' profile locally.
datasphere.security.admin.username=${DATASPHERE_ADMIN_USERNAME:}
datasphere.security.admin.display-name=${DATASPHERE_ADMIN_DISPLAY_NAME:Administrator}
datasphere.security.admin.password-hash=${DATASPHERE_ADMIN_PASSWORD_HASH:}

datasphere.security.login.max-attempts=5
datasphere.security.login.lockout-duration=15m

datasphere.limits.max-tables-per-job=50
datasphere.limits.max-batch-size=10000
datasphere.limits.default-batch-size=1000
datasphere.limits.default-fetch-size=1000
datasphere.limits.max-concurrent-jobs=2

# ---- Logging (see logback-spring.xml) ----
logging.file.path=${DATASPHERE_LOG_DIR:./logs}

# ---- Migration projects (saved mappings and approvals) ----
# Projects are stored as JSON files here. Database passwords are NEVER written to this folder.
datasphere.storage.data-dir=${DATASPHERE_DATA_DIR:./data}

# Hosts that source/target connections may use (comma separated; host name, IPv4 address or *.suffix).
# Empty means "any host" in development. The prod profile requires a non-empty list.
datasphere.security.db-hosts.allowed=${DATASPHERE_DB_ALLOWED_HOSTS:}
