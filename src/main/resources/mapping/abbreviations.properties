# ---------------------------------------------------------------------------
# DataSphere Migration Studio - built-in abbreviation and synonym dictionary
#
# Used by the deterministic mapping engine (no AI, no external service).
# To extend or override it, point datasphere.mapping.abbreviation-file at your own file with the same format;
# its entries are added to these.
#
#   abbr.<ABBREVIATION>=<EXPANSION>     one expansion per abbreviation; join words with _
#   context.suffix=<A>,<B>              ambiguous abbreviations: expanded only as the LAST word of a name that has
#                                       at least two words (EMP_ID -> EMPLOYEE IDENTIFIER, but a lone ID stays ID)
#   synonym.strong.<n>=<A>,<B>,<C>      words that mean the same thing (full credit, still shown as a reason)
#   synonym.weak.<n>=<A>,<B>,<C>        words that are only loosely related (half credit, mapping always reviewed)
# ---------------------------------------------------------------------------

# People and organisations
abbr.EMP=EMPLOYEE
abbr.EMPL=EMPLOYEE
abbr.MGR=MANAGER
abbr.CUST=CUSTOMER
abbr.CUSTR=CUSTOMER
abbr.DEPT=DEPARTMENT
abbr.ORG=ORGANIZATION
abbr.USR=USER
abbr.FNAME=FIRST_NAME
abbr.LNAME=LAST_NAME
abbr.MNAME=MIDDLE_NAME
abbr.SURNAME=LAST_NAME
abbr.DOB=DATE_OF_BIRTH
abbr.DOJ=DATE_OF_JOINING
abbr.BRNCH=BRANCH

# Common words
abbr.NM=NAME
abbr.NAM=NAME
abbr.NO=NUMBER
abbr.NUM=NUMBER
abbr.NBR=NUMBER
abbr.ID=IDENTIFIER
abbr.DT=DATE
abbr.TS=TIMESTAMP
abbr.ADDR=ADDRESS
abbr.ADR=ADDRESS
abbr.CTRY=COUNTRY
abbr.CNTRY=COUNTRY
abbr.PH=PHONE
abbr.MOB=MOBILE
abbr.EML=EMAIL
abbr.DESC=DESCRIPTION
abbr.DESCR=DESCRIPTION
abbr.CD=CODE
abbr.STS=STATUS
abbr.STAT=STATUS
abbr.TYP=TYPE
abbr.CAT=CATEGORY
abbr.REF=REFERENCE
abbr.DOC=DOCUMENT
abbr.FLG=FLAG
abbr.IND=INDICATOR
abbr.CNT=COUNT
abbr.TOT=TOTAL
abbr.PCT=PERCENT
abbr.SEQ=SEQUENCE
abbr.CRT=CREATED
abbr.UPD=UPDATED

# Finance and commerce
abbr.ACC=ACCOUNT
abbr.ACCT=ACCOUNT
abbr.AMT=AMOUNT
abbr.BAL=BALANCE
abbr.CCY=CURRENCY
abbr.CURR=CURRENCY
abbr.TXN=TRANSACTION
abbr.TRNX=TRANSACTION
abbr.TRX=TRANSACTION
abbr.SAL=SALARY
abbr.QTY=QUANTITY
abbr.PRC=PRICE
abbr.PROD=PRODUCT
abbr.INV=INVOICE
abbr.PMT=PAYMENT

# Ambiguous abbreviations expand only as the last word of a multi-word name
context.suffix=ID,CD,NO,PH,DT,TS,TYP,CAT,REF,IND

# Words that mean the same thing
synonym.strong.1=PHONE,TELEPHONE,TEL
synonym.strong.2=MOBILE,CELL,CELLULAR
synonym.strong.3=EMAIL,MAIL
synonym.strong.4=CUSTOMER,CLIENT
synonym.strong.5=ZIP,POSTAL,POSTCODE,PINCODE
synonym.strong.6=CREATED,CREATE
synonym.strong.7=UPDATED,MODIFIED
synonym.strong.8=SURNAME,FAMILY

# Loosely related words (partial credit, always reviewed by the user)
synonym.weak.1=IDENTIFIER,NUMBER,CODE,KEY
synonym.weak.2=DATE,TIMESTAMP,TIME
synonym.weak.3=DESCRIPTION,REMARK,COMMENT,NOTE
