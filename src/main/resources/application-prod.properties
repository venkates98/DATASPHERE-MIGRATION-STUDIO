# Production profile: serve over HTTPS only, no default accounts.
server.servlet.session.cookie.secure=true
# Uncomment when running behind a TLS-terminating reverse proxy you control:
# server.forward-headers-strategy=native

spring.thymeleaf.cache=true
logging.level.com.datasphere=INFO

# Outbound database connections must be restricted to known hosts in production.
# Set DATASPHERE_DB_ALLOWED_HOSTS, e.g. db1.corp.example,*.dbs.corp.example,10.20.0.0/16
datasphere.security.db-hosts.require-allow-list=true
